<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데스크탑 다열 시안 — 2026-09-06</title>

<style>
/* ─── 실제 앱 토큰 (src/global.css에서 그대로) ───────────────────────── */
@font-face { font-family:'Wanted Sans'; src:url('../../src/fonts/WantedSans-400.woff2') format('woff2'); font-weight:400; font-display:swap; }
@font-face { font-family:'Wanted Sans'; src:url('../../src/fonts/WantedSans-600.woff2') format('woff2'); font-weight:600; font-display:swap; }
@font-face { font-family:'Wanted Sans'; src:url('../../src/fonts/WantedSans-700.woff2') format('woff2'); font-weight:700; font-display:swap; }
@font-face { font-family:'Hakgyoansim'; src:url('../../src/fonts/HakgyoansimBadasseugi-L.woff2') format('woff2'); font-weight:400; font-display:swap; }

:root {
  --color-paper:#fbf9f6; --color-card:#fff; --color-ink:#2b4586; --color-muted:#7b84a3;
  --color-line:#e7e2d6; --color-axis:#cbc2b0; --color-rise:#c0392b; --color-rise-lo:#efeae3;
  --color-accent:#ed7328; --color-tint:#fbe7d6;
  --shadow-lift:0 2px 6px rgba(43,69,134,.06);
  --spacing-3xs:.2rem; --spacing-2xs:.3rem; --spacing-xs:.4rem; --spacing-sm:.6rem;
  --spacing-md:.8rem; --spacing-lg:1rem; --spacing-xl:1.5rem; --spacing-2xl:2.5rem; --spacing-3xl:3rem;
  --font-body:'Wanted Sans','Apple SD Gothic Neo',sans-serif;
  --font-hand:'Hakgyoansim','Wanted Sans',sans-serif;
  --font-mono:'SF Mono',Menlo,monospace;
  --radius-crisp:.2rem; --radius-soft:.4rem; --radius-pill:1rem;
  --text-2xs:.7rem; --text-xs:.8rem; --text-sm:.9rem; --text-md:1rem; --text-lg:1.5rem; --text-xl:1.7rem;
}
*{box-sizing:border-box}
*{scrollbar-width:none} *::-webkit-scrollbar{width:0;height:0;display:none}
body{margin:0;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-body);
     line-height:1.65;-webkit-font-smoothing:antialiased}

/* ─── 시안 전환 바 (프로토타입 전용 크롬 — 앱에 없음) ─────────────────── */
.rig{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;gap:.75rem;align-items:center;
     padding:.5rem .9rem;background:#2b4586;color:#fff;font-size:.78rem;letter-spacing:.02em}
.rig b{font-weight:700}
.rig button{font:inherit;font-size:.78rem;border:1px solid rgba(255,255,255,.35);background:transparent;
     color:#fff;padding:.25rem .7rem;border-radius:1rem;cursor:pointer;transition:background .15s}
.rig button[aria-pressed=true]{background:#fff;color:#2b4586;border-color:#fff;font-weight:700}
.rig .read{margin-left:auto;font-family:var(--font-mono);font-size:.72rem;opacity:.85;white-space:nowrap}
.rig .read s{text-decoration:none;color:#ffc400}
body{padding-top:2.6rem}

/* ═══ 공통 앱 셸 ═══════════════════════════════════════════════════════ */
#app{max-width:28rem;margin:0 auto;padding:var(--spacing-xl) var(--spacing-lg) var(--spacing-3xl)}
header{position:relative;margin-bottom:var(--spacing-xl)}
header::before{content:'';position:absolute;top:-.6rem;right:-.4rem;width:9rem;height:7rem;
  background:var(--color-tint);border-radius:48% 52% 61% 39%/55% 44% 56% 45%;z-index:-1}
.week{font-size:var(--text-sm);letter-spacing:.02em;margin:var(--spacing-xs) 0 0}
header h1{font-weight:700;font-size:var(--text-lg);line-height:1.45;
  margin:var(--spacing-3xs) 0 var(--spacing-xs);word-break:keep-all;text-wrap:balance}
.surveyed{color:var(--color-muted);font-size:var(--text-xs);margin:0}
.sprig{position:absolute;top:-.2rem;right:.6rem;width:4.2rem;height:4.2rem;opacity:.35;color:var(--color-ink)}

.controls{display:flex;flex-direction:column;gap:var(--spacing-sm);margin-bottom:var(--spacing-xl)}
.search{border:1px solid var(--color-line);border-radius:var(--radius-pill);background:var(--color-card);
  padding:var(--spacing-xs) var(--spacing-md);font:inherit;font-size:var(--text-sm);color:var(--color-muted)}
.seg{display:inline-flex;align-self:start;background:#f2eee6;border-radius:var(--radius-pill);padding:3px;
  box-shadow:inset 0 1px 2px rgba(43,69,134,.08)}
.seg span{font-size:var(--text-xs);padding:.25rem .8rem;border-radius:calc(var(--radius-pill) - 3px);
  min-width:3.4rem;text-align:center;color:var(--color-muted)}
.seg span[data-on]{background:var(--color-card);color:var(--color-ink);font-weight:600;box-shadow:var(--shadow-lift)}
.ctrlrow{display:flex;align-items:center;gap:var(--spacing-sm)}
.chip{font-size:var(--text-xs);border:1px solid var(--color-line);border-radius:var(--radius-pill);
  padding:.2rem .7rem;color:var(--color-muted);background:var(--color-card)}
.chip[data-on]{background:var(--color-tint);border-color:var(--color-accent);color:var(--color-ink);font-weight:600}
.sortc{margin-left:auto;font-size:var(--text-xs);color:var(--color-muted)}

footer{margin-top:var(--spacing-2xl)}
footer p{color:var(--color-muted);font-size:var(--text-xs);line-height:1.35;margin:0}
footer p+p{margin-top:var(--spacing-3xs)}

/* ═══ 카드 (앱 마크업 그대로) ══════════════════════════════════════════ */
.list{display:flex;flex-direction:column;gap:var(--spacing-xl)}
.card{position:relative;background:var(--color-card);border:1px solid var(--color-line);
  border-radius:var(--radius-crisp);padding:var(--spacing-lg);box-shadow:var(--shadow-lift);
  transform-origin:top center;transition:border-color .15s ease;interpolate-size:allow-keywords}
.card[open]{border-color:var(--color-accent)}
.card::before{content:'';position:absolute;top:-.5rem;left:50%;width:3.4rem;height:1rem;
  transform:translateX(-50%) rotate(-2deg);background:color-mix(in srgb,var(--color-accent) 40%,transparent);
  border-radius:1px}
.card:nth-child(odd){transform:rotate(.4deg)}
.card:nth-child(even){transform:rotate(-.4deg)}
.card summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:var(--spacing-md)}
.card summary::-webkit-details-marker{display:none}
.card::details-content{height:0;opacity:0;overflow:clip;
  transition:height 240ms cubic-bezier(.4,0,.2,1),opacity 240ms cubic-bezier(.4,0,.2,1),
             content-visibility 240ms allow-discrete}
.card[open]::details-content{height:auto;opacity:1}

.idrow{display:flex;align-items:center;gap:var(--spacing-sm)}
.mark{flex:none;width:6rem;height:6rem;display:flex;align-items:center;justify-content:center}
.mark img{width:100%;height:100%;object-fit:contain}
.idtext{min-width:0;flex:1}
.cardTitle{font-size:var(--text-md);font-weight:600;display:inline-flex;align-items:center;
  gap:var(--spacing-xs);word-break:keep-all}
.dot{width:.4rem;height:.4rem;border-radius:50%;background:var(--color-accent);flex:none}
.kind{display:block;color:var(--color-muted);font-size:var(--text-xs);margin-top:var(--spacing-3xs)}

.price{display:flex;align-items:baseline;gap:var(--spacing-sm);flex-wrap:wrap}
.big{font-size:var(--text-xl);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.was{color:var(--color-muted);text-decoration:line-through;font-size:var(--text-sm);font-variant-numeric:tabular-nums}
.delta{font-size:var(--text-xs);font-weight:600;padding:.1rem .45rem;border-radius:var(--radius-soft);
  background:var(--color-tint)}
.delta[data-rise]{background:var(--color-rise-lo);color:var(--color-rise)}
.base{display:block;color:var(--color-muted);font-size:var(--text-xs);width:100%;margin-top:var(--spacing-3xs)}

.strip{width:100%}
.stripbar{position:relative;height:.55rem;margin:0 calc(100%/24)}
.stripbar i{position:absolute;top:0;bottom:0;background:var(--color-tint);border-radius:1px}
.stripbar i[data-peak]{background:var(--color-accent)}
.stripaxis{position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--color-line)}
.months{display:grid;grid-template-columns:repeat(12,1fr);font-family:var(--font-mono);
  font-size:var(--text-2xs);color:var(--color-muted);text-align:center;margin-top:.15rem}
.months b{color:var(--color-ink);font-weight:700}

.why{font-family:var(--font-hand);color:var(--color-muted);font-size:var(--text-md);line-height:1.3;
  margin:0;transform:rotate(-.5deg);transform-origin:left center;-webkit-font-smoothing:auto}

.open{padding-top:var(--spacing-lg);display:flex;flex-direction:column;gap:var(--spacing-xl)}
.open::before{content:'';border-top:1px dashed var(--color-line)}
.spark{height:3rem;border-bottom:1px solid var(--color-axis)}
.spark svg{width:100%;height:100%;overflow:visible}
.nut{font-size:var(--text-xs);color:var(--color-muted)}
.note h4{font-size:var(--text-2xs);letter-spacing:.08em;color:var(--color-muted);margin:0 0 .2rem}
.note p{font-size:var(--text-sm);margin:0 0 var(--spacing-sm);line-height:1.55}
.rlabel{font-size:var(--text-2xs);letter-spacing:.08em;color:var(--color-muted);margin:0 0 var(--spacing-2xs)}
.rchips{display:flex;gap:var(--spacing-xs);overflow-x:auto}
.rchips span{white-space:nowrap;font-size:var(--text-xs);border:1px solid var(--color-line);
  border-radius:var(--radius-pill);padding:.2rem .7rem;background:var(--color-card)}

/* ═══════════════════════════════════════════════════════════════════════
   카드 variant — 세로 스택형
   가로형은 [도판 96 | 이름]이 한 행을 먹고 그 아래 가격·띠·한마디가 쌓인다.
   스택형은 그 첫 행마저 세로로 눕혀, 도판이 카드 폭 전체를 쓰는 표지가 된다.
   → 열 하한이 19rem에서 14rem으로 내려가고, 도판은 96px에서 ~2배로 커진다.
   ═══════════════════════════════════════════════════════════════════════ */
body{--col-min:19rem}
body[data-card=stack]{--col-min:14rem}

body[data-card=stack] .idrow{
  flex-direction:column;
  align-items:stretch;
  gap:var(--spacing-sm);
  text-align:left;
}
/* 도판 — 카드 폭 전체를 쓰되 높이는 고정. aspect-ratio로 하면 열 폭에 따라 카드가
   같이 길어져(그리고 자동 최소 크기 때문에 비율이 무시돼) 세로가 통제를 벗어난다.
   실제 에셋이 288px 정사각 투명 WebP라 contain으로 중앙에 앉힌다. */
body[data-card=stack] .mark{
  width:100%;
  height:7.5rem;
}
body[data-card=stack] .cardTitle{font-size:var(--text-md)}
/* 이름과 종류를 한 줄에 — 세로로 길어지는 걸 한 줄 아껴 상쇄한다 */
body[data-card=stack] .idtext{display:flex;align-items:baseline;gap:var(--spacing-xs);flex-wrap:wrap}
body[data-card=stack] .kind{display:inline;margin-top:0}
/* 좁은 열에서 취소선 가격과 등락 칩이 큰 숫자와 한 줄에 안 들어간다 — 아랫줄로 내린다 */
body[data-card=stack] .price{row-gap:var(--spacing-3xs)}
body[data-card=stack] .big{width:100%}
body[data-card=stack] .why{font-size:var(--text-sm)}
/* 테이프는 좁아진 카드에 맞춰 한 치수 줄인다 */
body[data-card=stack] .card::before{width:2.6rem;height:.8rem}

/* ═══════════════════════════════════════════════════════════════════════
   시안 A — 좌판 (Grid only)
   크롬(머리말·컨트롤·푸터)은 28rem 중앙 유지. 카드 목록만 넓혀 격자로 흐른다.
   ═══════════════════════════════════════════════════════════════════════ */
@media (min-width:48rem){
  body[data-plan=a] #app{max-width:64rem}
  body[data-plan=a] header,
  body[data-plan=a] .controls,
  body[data-plan=a] footer{max-width:28rem;margin-left:auto;margin-right:auto}
  body[data-plan=a] .list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(var(--col-min),1fr));
    align-items:start;
    gap:var(--spacing-2xl) var(--spacing-xl);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   시안 B — 전폭 (Full-width chrome)
   머리말·컨트롤·푸터도 함께 넓어진다. 컨트롤이 한 줄로 눕는다.
   ═══════════════════════════════════════════════════════════════════════ */
@media (min-width:48rem){
  body[data-plan=b] #app{max-width:64rem}
  body[data-plan=b] header h1{max-width:22ch}
  body[data-plan=b] header::before{width:12rem;height:8rem;right:-1rem}
  body[data-plan=b] .controls{flex-direction:row;align-items:center;gap:var(--spacing-md);flex-wrap:wrap}
  body[data-plan=b] .controls .search{flex:1;min-width:12rem;max-width:20rem}
  body[data-plan=b] .ctrlrow{flex:1;min-width:16rem}
  body[data-plan=b] .list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(var(--col-min),1fr));
    align-items:start;
    gap:var(--spacing-2xl) var(--spacing-xl);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   시안 C — 펼친 낱장 (Sticky side chrome)
   좌측에 머리말+컨트롤이 붙박이로 서고, 우측에 카드 격자 2열.
   달력을 펼쳐 왼쪽 면은 표지, 오른쪽 면은 목록.
   ═══════════════════════════════════════════════════════════════════════ */
@media (min-width:60rem){
  body[data-plan=c] #app{
    max-width:64rem;
    display:grid;
    grid-template-columns:17rem 1fr;
    gap:var(--spacing-2xl);
    align-items:start;
  }
  body[data-plan=c] header{grid-column:1;position:sticky;top:4rem;margin-bottom:var(--spacing-xl)}
  body[data-plan=c] main{grid-column:2;grid-row:1/span 2}
  body[data-plan=c] footer{grid-column:1;position:sticky;top:22rem;margin-top:0;
    border-top:1px dashed var(--color-line);padding-top:var(--spacing-md)}
  body[data-plan=c] .controls{margin-bottom:var(--spacing-xl)}
  body[data-plan=c] .list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    align-items:start;
    gap:var(--spacing-2xl) var(--spacing-xl);
  }
}

@media (prefers-reduced-motion:reduce){
  .card,.card::details-content{transition:none}
}
</style>
</head>
<body data-plan="a" data-card="row" data-season="autumn">

<div class="rig">
  <b>카드</b>
  <button data-c="row" aria-pressed="true">가로형(현재)</button>
  <button data-c="stack" aria-pressed="false">세로 스택</button>
  <b style="margin-left:.6rem">셸</b>
  <button data-p="a" aria-pressed="true">A 좌판</button>
  <button data-p="b" aria-pressed="false">B 전폭</button>
  <button data-p="c" aria-pressed="false">C 펼친 낱장</button>
  <button data-p="now" aria-pressed="false">현재</button>
  <span class="read">뷰포트 <s id="vw">–</s> · 열 <s id="cols">–</s> · 카드 안쪽 <s id="cw">–</s></span>
</div>

<div id="app">
  <header>
    <svg class="sprig" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M50 92 C50 60 52 34 58 12"/>
      <path d="M52 62 C38 58 30 48 28 36 C42 38 50 46 52 62Z"/>
      <path d="M54 46 C68 44 76 36 78 24 C64 24 56 32 54 46Z"/>
      <circle cx="58" cy="14" r="4"/><circle cx="46" cy="24" r="3"/>
    </svg>
    <p class="week">백로 · 9월 첫째 주</p>
    <h1>이 계절을 맛보는 가장 알뜰한 방법</h1>
    <p class="surveyed">2일 전 · 전국 평균</p>
  </header>

  <main>
    <section class="picks">
      <div class="controls">
        <div class="search">품목 검색</div>
        <div class="seg"><span>전체</span><span data-on>과일</span><span>채소</span><span>수산물</span></div>

          <span class="chip" data-on>한창 제철</span>

    <p>영양: 식품의약품안전처 국가표준식품성분 · 100g 기준</p>
    <p>레시피: 식품의약품안전처 조리식품 레시피 DB</p>
  </footer>
</div>

<script>
// 실제 produce.json / prices.json에서 뽑은 값에 가깝게 구성한 표본 9장.
const CARDS = [
  {img:'grape',   name:'포도',       kind:'캠벨얼리', now:'4,180', was:'5,020', d:'-16.7%', base:'1kg 기준',
   season:[8,9,10], peak:[9], why:'9월 포도가 가장 진해요', pick:'알이 촘촘하고 흰 분이 고르게 앉은 것.'},
  {img:'pear',    name:'배',         kind:'신고',     now:'3,540', was:'3,910', d:'-9.5%',  base:'1개 기준',
   season:[9,10,11], peak:[9,10], why:'추석 무렵 배가 가장 시원해요', pick:'묵직하고 껍질이 매끈한 것.'},
  {img:'apple',   name:'사과',       kind:'홍로',     now:'2,780', was:'2,640', d:'+5.3%', rise:1, base:'1개 기준',
   season:[9,10,11], peak:[10], why:'홍로가 먼저 오는 계절이에요', pick:'꼭지가 마르지 않고 단단한 것.'},
  {img:'sweet-persimmon', name:'단감', kind:'부유',   now:'1,930', was:'2,310', d:'-16.5%', base:'1개 기준',
   season:[9,10,11], peak:[10,11], why:'아직 이른 단감은 아삭해요', pick:'꼭지가 붙어 있고 색이 고른 것.'},
  {img:'spinach', name:'시금치',     kind:'노지',     now:'1,240', was:'1,620', d:'-23.5%', base:'100g 기준',
   season:[9,10,11,12,1,2], peak:[11,12], why:'가을 시금치가 단맛을 품기 시작해요', pick:'뿌리가 붉고 잎이 도톰한 것.'},
  {img:'hairtail', name:'갈치',      kind:'냉장',     now:'12,480', was:'14,100', d:'-11.5%', base:'1마리 기준',
   season:[9,10,11], peak:[10,11], why:'가을 갈치는 기름이 올라요', pick:'은빛이 벗겨지지 않고 눈이 맑은 것.'},
  {img:'sweet-pumpkin', name:'단호박', kind:'노지',   now:'2,050', was:'2,240', d:'-8.5%', base:'1개 기준',
   season:[8,9,10], peak:[9], why:'단호박이 가장 포슬한 철이에요', pick:'꼭지가 마르고 묵직한 것.'},
  {img:'squid',   name:'물오징어',   kind:'생물',     now:'4,760', was:'4,180', d:'+13.9%', rise:1, base:'1마리 기준',
   season:[9,10,11,12], peak:[10,11], why:'가을 오징어가 통통해져요', pick:'몸이 투명하고 탄력 있는 것.'},
  {img:'radish',  name:'무',         kind:'가을무',   now:'1,480', was:'1,880', d:'-21.3%', base:'1개 기준',
   season:[10,11,12], peak:[11,12], why:'가을무가 단단해지는 때예요', pick:'매끈하고 묵직하며 잔뿌리가 적은 것.'},
];
const NOW_MONTH = 9;

const strip = (season, peak) => {
  const seg = [];
  let run = null;
  for (let m = 1; m <= 12; m++) {
    const on = season.includes(m), pk = peak.includes(m);
    if (!on) { if (run) { seg.push(run); run = null; } continue; }
    if (run && run.pk === pk && run.end === m - 1) run.end = m;
    else { if (run) seg.push(run); run = {start:m, end:m, pk}; }
  }
  if (run) seg.push(run);
  const bars = seg.map(s => {
    const l = (s.start - 1) / 12 * 100, w = (s.end - s.start + 1) / 12 * 100;
    return `<i style="left:${l}%;width:${w}%"${s.pk ? ' data-peak' : ''}></i>`;
  }).join('');
  const months = Array.from({length:12}, (_, i) => {
    const m = i + 1;
    if (m === NOW_MONTH) return `<b>${m}</b>`;
    return season.includes(m) ? `<span>${m}</span>` : '<span></span>';
  }).join('');
  return `<div class="strip"><div class="stripbar"><div class="stripaxis"></div>${bars}</div>
          <div class="months">${months}</div></div>`;
};

const sparkPath = () => {
  const pts = Array.from({length:14}, (_, i) => [i / 13 * 100, 20 + Math.sin(i * .9) * 8 + (13 - i) * 1.4]);
  return `<svg viewBox="0 0 100 44" preserveAspectRatio="none">
    <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none"
      stroke="var(--color-ink)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <circle cx="100" cy="${pts[13][1]}" r="2" fill="var(--color-ink)"/></svg>`;
};

document.getElementById('list').innerHTML = CARDS.map((c, i) => `
<details class="card"${i === 0 ? ' open' : ''}>
  <summary>
    <div class="idrow">
      <span class="mark"><img src="../../public/assets/produce/${c.img}.webp" width="96" height="96" alt=""
        loading="${i < 2 ? 'eager' : 'lazy'}"></span>
      <span class="idtext">
        <span class="cardTitle">${c.name}${c.peak.includes(NOW_MONTH) ? '<span class="dot"></span>' : ''}</span>
        <span class="kind">${c.kind}</span>
      </span>
    </div>
    <div class="price">
      <span class="big">${c.now}원</span>
      <span class="was">${c.was}원</span>
      <span class="delta"${c.rise ? ' data-rise' : ''}>${c.d}</span>
      <span class="base">${c.base}</span>
    </div>
    ${strip(c.season, c.peak)}
    <p class="why">${c.why}</p>
  </summary>
  <div class="open">
    <div class="spark">${sparkPath()}</div>
    <p class="nut">100g · 열량 52kcal · 식이섬유 1.7g · 비타민C 8mg</p>
    <div class="note">
      <h4>고르는 법</h4><p>${c.pick}</p>
      <h4>보관</h4><p>신문지에 싸 냉장 채소칸에. 세워 두면 더 오래가요.</p>
    </div>
    <div>
      <p class="rlabel">레시피</p>
      <div class="rchips"><span>${c.name} 무침</span><span>${c.name} 조림</span><span>${c.name}전</span></div>
    </div>
  </div>
</details>`).join('');

// ── 시안 전환 + 실측 리드아웃 ────────────────────────────────────────
const rig = document.querySelector('.rig');
rig.addEventListener('click', e => {
  const b = e.target.closest('button[data-p],button[data-c]');
  if (!b) return;
  const axis = b.dataset.p ? 'p' : 'c';
  rig.querySelectorAll(`button[data-${axis}]`).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  if (axis === 'p') document.body.dataset.plan = b.dataset.p;
  else document.body.dataset.card = b.dataset.c;
  measure();
});

function measure() {
  const list = document.getElementById('list');
  const card = list.firstElementChild;
  const cs = getComputedStyle(list);
  const cols = cs.display === 'grid' ? cs.gridTemplateColumns.split(' ').length : 1;
  const inner = card ? card.clientWidth - 32 : 0;   // padding lg 좌우 16+16
  document.getElementById('vw').textContent = window.innerWidth + 'px';
  document.getElementById('cols').textContent = cols;
  document.getElementById('cw').textContent = Math.round(inner) + 'px';
}
addEventListener('resize', measure);
measure();
</script>
</body>
</html>
